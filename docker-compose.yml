version: '3.8'

services:
  printer-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printer-gateway
    restart: always
    # Use host network mode so Bonjour service mDNS packets bypass Docker bridge network blocks
    network_mode: host
    environment:
      - PRINTER_NAME=HP DeskJet 5275
      - DATABASE_PATH=/app/data/printer.db
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
